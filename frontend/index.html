<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChartMate — AI 투자 비서</title>
  <style>
    :root{
      --bg:#f6f8fc; --card:#ffffff; --line:#e3e8f0; --text:#1c2533;
      --muted:#6b7689; --accent:#3b6cff; --accent-soft:#eaf0ff;
      --up:#e8f6ee; --up-text:#127a3e; --warn:#fff4e5; --warn-text:#8a5300;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:"Segoe UI","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
    .notice{background:var(--warn);color:var(--warn-text);font-size:13px;text-align:center;padding:8px 16px;border-bottom:1px solid var(--line);}
    header{max-width:720px;margin:0 auto;padding:22px 16px 8px;}
    header h1{font-size:24px;margin:0;}
    header p{margin:4px 0 0;color:var(--muted);font-size:14px;}
    .wrap{max-width:720px;margin:0 auto;padding:12px 16px 40px;}
    /* 입력 */
    .ask{display:flex;gap:8px;margin:12px 0;}
    .ask input{flex:1;font-size:16px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);}
    .ask input:focus{outline:2px solid var(--accent);}
    .ask button{font-size:16px;font-weight:700;padding:0 20px;border:none;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer;}
    .ask button:disabled{opacity:.5;cursor:default;}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
    .chip{font-size:14px;padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--text);cursor:pointer;}
    .chip:hover{border-color:var(--accent);color:var(--accent);}
    /* 메시지 */
    #feed{display:flex;flex-direction:column;gap:14px;}
    .u{align-self:flex-end;background:var(--accent);color:#fff;padding:10px 15px;border-radius:14px 14px 4px 14px;font-size:15px;max-width:85%;}
    .a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:14px 16px;font-size:15px;max-width:92%;width:100%;box-shadow:0 1px 3px rgba(20,40,80,.04);}
    .a .line{padding:3px 0;}
    .a .bullet{display:flex;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line);}
    .a .bullet:last-child{border-bottom:none;}
    .a .disc{color:var(--muted);font-size:12px;margin-top:8px;}
    .a .head{font-weight:700;font-size:16px;margin-bottom:6px;}
    .loading{align-self:flex-start;color:var(--muted);font-style:italic;padding:10px 4px;}
    footer{max-width:720px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:12px;}
  </style>
</head>
<body>
  <div class="notice">⚠️ ChartMate는 AI가 생성한 <b>투자 참고용</b> 정보를 제공하며, 투자자문·매매 권유가 아닙니다.</div>

  <header>
    <h1>📊 ChartMate</h1>
    <p>종목 이름만 넣으면 현재가·추세·변동성을 한눈에 브리핑해 드려요.</p>
  </header>

  <div class="wrap">
    <div class="ask">
      <input id="q" type="text" placeholder="예: 엔비디아 지금 어때?  /  NVDA  /  비트코인" onkeydown="if(event.key==='Enter')send()" />
      <button id="send" onclick="send()">분석</button>
    </div>
    <div class="chips">
      <span class="chip" onclick="quick('엔비디아 지금 어때?')">엔비디아</span>
      <span class="chip" onclick="quick('애플 지금 어때?')">애플</span>
      <span class="chip" onclick="quick('테슬라 지금 어때?')">테슬라</span>
      <span class="chip" onclick="quick('비트코인 지금 어때?')">비트코인</span>
    </div>

    <div id="feed"></div>
  </div>

  <footer>ChartMate · 생성형 AI(OpenAI) + 시세·지표 분석(yfinance) 기반 · 투자 판단과 책임은 이용자 본인에게 있습니다.</footer>

  <script>
    // 로컬 테스트는 localhost, 배포 시엔 배포된 백엔드 주소로 자동 전환
    const API_BASE_URL =
      (location.protocol === "file:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")
        ? "http://localhost:8000"
        : "https://REPLACE-WITH-DEPLOYED-BACKEND.onrender.com"; // 배포 후 교체

    const feed = document.getElementById("feed");
    const input = document.getElementById("q");
    const sendBtn = document.getElementById("send");
    let history = [];

    function quick(text){ input.value = text; send(); }

    function addUser(text){
      const el = document.createElement("div");
      el.className = "u";
      el.textContent = text;
      feed.appendChild(el);
      scroll();
    }

    function addLoading(){
      const el = document.createElement("div");
      el.className = "loading";
      el.textContent = "분석 중… (무료 서버라 처음엔 30초~1분 걸릴 수 있어요)";
      el.id = "loading";
      feed.appendChild(el);
      scroll();
    }
    function removeLoading(){ const l=document.getElementById("loading"); if(l) l.remove(); }

    // 브리핑 텍스트를 보기 좋게 렌더
    function addAssistant(text){
      const el = document.createElement("div");
      el.className = "a";
      const lines = (text || "").split("\n").filter(l => l.trim() !== "");
      lines.forEach((ln, i) => {
        const d = document.createElement("div");
        const t = ln.trim();
        if (t.startsWith("·") || t.startsWith("-")) {
          d.className = "bullet";
          d.innerHTML = "<span>•</span><span>" + escapeHtml(t.replace(/^[·\-]\s*/, "")) + "</span>";
        } else if (t.startsWith("※")) {
          d.className = "disc";
          d.textContent = t;
        } else if (i === 0) {
          d.className = "head";
          d.textContent = t;
        } else {
          d.className = "line";
          d.textContent = t;
        }
        el.appendChild(d);
      });
      feed.appendChild(el);
      scroll();
    }

    function escapeHtml(s){ const p=document.createElement("p"); p.textContent=s; return p.innerHTML; }
    function scroll(){ window.scrollTo(0, document.body.scrollHeight); }

    async function send(){
      const msg = input.value.trim();
      if (!msg) return;
      input.value = "";
      sendBtn.disabled = true;
      addUser(msg);
      addLoading();
      try{
        const res = await fetch(`${API_BASE_URL}/api/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg, history })
        });
        const data = await res.json();
        removeLoading();
        if (data.answer){
          addAssistant(data.answer);
          history.push({ role:"user", content: msg });
          history.push({ role:"assistant", content: data.answer });
        } else {
          addAssistant("⚠️ 응답을 받지 못했어요. 잠시 후 다시 시도해 주세요.");
        }
      }catch(e){
        removeLoading();
        addAssistant("⚠️ 서버에 연결하지 못했어요. 백엔드가 실행 중인지 확인해 주세요.");
      }finally{
        sendBtn.disabled = false;
        input.focus();
      }
    }
  </script>
</body>
</html>
